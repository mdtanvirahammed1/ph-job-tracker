<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <body>
<header>
    <h1>Job Application Tracker</h1>
</header>
<section class="dashboard">
    <div class="dash-card">
        <p>Total</p>
        <h2 id="allCount">8</h2>
    </div>
    <div class="dash-card">
        <p>Interview</p>
        <h2 id="interviewCount">0</h2>
    </div>
    <div class="dash-card">
        <p>Rejected</p>
        <h2 id="rejectedCount">0</h2>
    </div>
</section>
<section class="jobs-section">

    <div class="jobs-header">
        <h3>Available Jobs</h3>
        <span id="tabCount">8 Jobs</span>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="all">All</button>
        <button class="tab" data-tab="interview">Interview</button>
        <button class="tab" data-tab="rejected">Rejected</button>
    </div>

    <div id="jobsContainer" class="jobs-container"></div>

    <div id="emptyState" class="empty hidden">
        <img src="images/jobs.png" alt="">
        <h4>No Jobs Available</h4>
        <p>Please check back later.</p>
    </div>

</section>

<script src="script.js"></script>
</body>
</body>
</html>
